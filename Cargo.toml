[package]
name = "tricoach"
version = "0.1.0"
edition = "2021"
description = "AI triathlon planner backed by intervals.icu"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
reqwest = { version = "0.13.5", features = ["json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
toml = "1.2.1"
