# Copy this file to tricoach.toml and edit it.
# Dates are quoted strings in YYYY-MM-DD form.

[race]
name = "Ironman 70.3 Maine"
date = "2027-07-25"

# Weekly training hours for a normal (non-recovery) week.
# The most recent entry whose `from` date has passed applies, so add a new
# entry whenever the time you have available changes.
[[hours]]
from = "2026-11-16"
hours = 6.0

